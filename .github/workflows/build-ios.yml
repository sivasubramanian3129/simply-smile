name: Build iOS App

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: macos-latest
    name: Build iOS package
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install, Sync, and Install Pods
        run: |
          npm install
          mkdir -p www
          echo "<!DOCTYPE html><html><body><h1>Simply Smile</h1></body></html>" > www/index.html
          npx cap sync ios
          # Ensure we are in the right folder and check for Podfile
          cd ios/App
          if [ ! -f "Podfile" ]; then
            echo "Podfile missing, generating default iOS pod configuration..."
            # If Capacitor didn't generate one, we create a standard Capacitor Podfile
            cat << 'EOF' > Podfile
            platform :ios, '13.0'
            use_frameworks!
            target 'App' do
              capacitor_pods
            end
            EOF
          fi
          pod install
          
      - name: Build iOS Simulator App (Test Build)
        run: |
          xcodebuild -workspace ios/App/App.xcworkspace \
                     -scheme App \
                     -sdk iphonesimulator \
                     -configuration Debug \
                     build CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO
