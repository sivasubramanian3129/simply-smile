name: Build iOS App

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: macos-latest
    name: Build iOS package
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies & build web app
        run: |
          npm install
          npm run build

      - name: Install CocoaPods
        run: |
          cd ios/App
          pod install

      - name: Build iOS Simulator App (Test Build)
        run: |
          xcodebuild -workspace ios/App/App.xcworkspace \
                     -scheme App \
                     -sdk iphonesimulator \
                     -configuration Debug \
                     build CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO
